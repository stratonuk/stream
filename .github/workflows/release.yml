name: Release

# Triggered by pushing a tag like `v1.0.1`. Builds the release APK with
# the permanent STREAM signing certificate and attaches it for Downloader.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.1)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0bdd871935719febd78681f197cd39af5b6e16a6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Resolve version from tag
        id: version
        run: |
          TAG_REF="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG_REF#v}"
          echo "tag=${TAG_REF}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Decode release signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is required for in-place updates"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.jks
          ls -la app/release.jks

      - name: Build release APK
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are incomplete — see RELEASE_SIGNING.md"
            exit 1
          fi
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK certificate fingerprint
        run: |
          EXPECTED="cbbf8d3b51a24f62039c1a29a8a6b272bcf93ece077e668f095f83a29b1e268b"
          ACTUAL=$(apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | awk -F': ' '/SHA-256 digest/{print tolower($2); exit}')
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Signing certificate mismatch — refusing to publish (would break in-place updates)"
            exit 1
          fi

      - name: Rename APK with version + stable alias
        id: rename
        run: |
          SOURCE="app/build/outputs/apk/release/app-release.apk"
          VERSIONED="app/build/outputs/apk/release/stream-${{ steps.version.outputs.version }}.apk"
          STABLE="app/build/outputs/apk/release/stream.apk"
          cp "$SOURCE" "$VERSIONED"
          cp "$SOURCE" "$STABLE"
          echo "versioned_apk=${VERSIONED}" >> "$GITHUB_OUTPUT"
          echo "stable_apk=${STABLE}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: STREAM ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            ${{ steps.rename.outputs.versioned_apk }}
            ${{ steps.rename.outputs.stable_apk }}
          fail_on_unmatched_files: true
          body: |
            ## Install / update with Downloader

            ```
            https://github.com/stratonuk/stream/releases/latest/download/stream.apk
            ```

            This release is signed with the **same permanent certificate** as previous STREAM builds.
            Installing over an existing STREAM app keeps your login, favourites and continue watching.

            See SAFE_UPDATES.md and RELEASE_SIGNING.md.
